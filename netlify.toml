# Netlify build config for the Vite PWA.
# Point Netlify at this branch and it builds automatically on push.
[build]
  command = "npm run build"
  publish = "dist"

# SPA-ish static app: the proxy API lives on Render, not here, so no redirects
# needed. The service worker + manifest are copied verbatim from public/.

# ── Security headers (defence-in-depth) ──────────────────────────────────────
# CSP is the primary XSS backstop: even if a crafted feed value slipped past the
# esc()/safeUrl() sanitisers, this blocks external script loads, eval, and object
# embeds. script-src keeps 'unsafe-inline' because the app uses inline onclick=
# handlers (the 42 bridged functions) — removing that needs an event-delegation
# refactor first. connect-src is pinned to the exact backends the app talks to.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://nsw-planner.onrender.com https://api.open-meteo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
